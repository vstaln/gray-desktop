[package]
name = "gray-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "desktop plugin for the gray agent harness"
license = "MIT"
[lib]
name = "desktop_plugin"
path = "src/lib.rs"
[[bin]]
name = "desktop"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
